<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName lifeguardmeldkamer.nl
    ServerAlias www.lifeguardmeldkamer.nl
    ServerAlias poc.lifeguardmeldkamer.nl

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 3600
    RewriteEngine On

    # LiveKit signaling. Deze regels MOETEN vóór de algemene WebSocket-regel staan.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/rtc(.*)$ ws://127.0.0.1:7880/rtc$1 [P,L]

    # Django Channels control-WebSockets.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:8003/$1 [P,L]

    # LiveKit HTTP/signaling requests vóór de algemene Django ProxyPass.
    ProxyPass        /rtc http://127.0.0.1:7880/rtc connectiontimeout=5 timeout=3600 retry=0
    ProxyPassReverse /rtc http://127.0.0.1:7880/rtc

    # Django/ASGI.
    ProxyPass        / http://127.0.0.1:8003/ connectiontimeout=5 timeout=3600
    ProxyPassReverse / http://127.0.0.1:8003/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/lifeguardmeldkamer-error.log
    CustomLog ${APACHE_LOG_DIR}/lifeguardmeldkamer-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/lifeguardmeldkamer.nl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lifeguardmeldkamer.nl/privkey.pem
</VirtualHost>
</IfModule>
