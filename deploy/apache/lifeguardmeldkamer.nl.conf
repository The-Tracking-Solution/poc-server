<VirtualHost *:80>
    ServerName lifeguardmeldkamer.nl
    ServerAlias www.lifeguardmeldkamer.nl
    ServerAlias poc.lifeguardmeldkamer.nl

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =lifeguardmeldkamer.nl [OR]
    RewriteCond %{SERVER_NAME} =poc.lifeguardmeldkamer.nl [OR]
    RewriteCond %{SERVER_NAME} =www.lifeguardmeldkamer.nl
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/lifeguardmeldkamer-error.log
    CustomLog ${APACHE_LOG_DIR}/lifeguardmeldkamer-access.log combined
</VirtualHost>
